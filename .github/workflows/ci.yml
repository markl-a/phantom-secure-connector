name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package with dev extra
        run: python -m pip install -e ".[dev]"
      - name: install dry-run
        run: python -m pip install -e . --dry-run --no-deps
      - name: wheel build
        run: python -m pip wheel . --no-deps -w dist
      - name: public deterministic smoke
        run: |
          python -m readiness.demo_loop --out /tmp/phantom-secure-demo --standard hipaa
          test -f /tmp/phantom-secure-demo/manifest.json
          python -m readiness.transform_pipeline --source /tmp/phantom-secure-demo/source-records.csv --out /tmp/phantom-secure-transform
          python -m readiness.guard_scenario --source /tmp/phantom-secure-transform --out /tmp/phantom-secure-guard
          test -f /tmp/phantom-secure-guard/manifest.json
      - name: pytest
        run: python -m pytest -q
      - name: release-prep gate
        run: python -m pytest readiness/tests/test_release_prep_contract.py -q
